port = 5433
listen_addresses = ''
data_directory = '/var/lib/postgresql/17/swp'
hba_file = '/etc/postgresql/17/swp/pg_hba.conf'
ident_file = '/etc/postgresql/17/swp/pg_ident.conf'
external_pid_file = '/run/postgresql/17-swp.pid'
unix_socket_directories = '/run/postgresql' # AF_UNIX only
unix_socket_group = 'swp-pg'
unix_socket_permissions = 0770

logging_collector = off
log_connections = off
log_disconnections = off
log_statement = 'none'
log_duration = off
log_min_error_statement = 'panic'
log_error_verbosity = terse
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
