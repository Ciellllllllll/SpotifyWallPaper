name: Spotify Auth Pages

on:
  push:
    tags: ['release-*']

permissions:
  contents: read

concurrency:
  group: spotify-auth-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-branch:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      master: ${{ steps.branch.outputs.master }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require a commit contained in develop or master
        id: branch
        shell: pwsh
        run: |
          $branches = @(git branch --remotes --contains HEAD --format='%(refname)')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release ancestry.' }
          $develop = $branches -ccontains 'refs/remotes/origin/develop'
          $master = $branches -ccontains 'refs/remotes/origin/master'
          if (-not ($develop -or $master)) { throw 'Release commit must be contained in develop or master.' }
          "master=$($master.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    needs: release-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w @spotify-wallpaper/spotify-auth
      - run: npm run test -w @spotify-wallpaper/spotify-auth
      - run: npm run test:security
      - run: npm run build -w @spotify-wallpaper/spotify-auth
      - run: node apps/spotify-auth/prepare-pages.mjs
      - run: node scripts/check-public-backend-secrets.mjs apps/spotify-auth/pages
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.auth.config.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: needs.release-branch.outputs.master == 'true' && vars.PAGES_DEPLOY_ENABLED == 'true'
        with:
          path: apps/spotify-auth/pages
          retention-days: 1

  deploy:
    needs: [release-branch, build]
    if: needs.release-branch.outputs.master == 'true' && vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy static authorization page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
