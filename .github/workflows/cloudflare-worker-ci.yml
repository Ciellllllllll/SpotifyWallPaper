name: Cloudflare Worker CI

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-worker-ci.yml
      - apps/cloudflare-worker/**
      - apps/wallpaper/**
      - crates/**
      - docs/operations/**
      - packages/shared-types/**
      - scripts/check-public-backend-secrets.mjs
      - Cargo.lock
      - Cargo.toml
      - package-lock.json
      - package.json
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-worker-ci.yml
      - apps/cloudflare-worker/**
      - apps/wallpaper/**
      - crates/**
      - docs/operations/**
      - packages/shared-types/**
      - scripts/check-public-backend-secrets.mjs
      - Cargo.lock
      - Cargo.toml
      - package-lock.json
      - package.json

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Test Cloudflare Worker
        run: npm run test -w @spotify-wallpaper/cloudflare-worker

      - name: Check Cloudflare Worker
        run: npm run check -w @spotify-wallpaper/cloudflare-worker

      - name: Verify generated Worker types are committed
        run: git diff --exit-code -- apps/cloudflare-worker/worker-configuration.d.ts

      - name: Test wallpaper
        run: npm run test -w @spotify-wallpaper/wallpaper

      - name: Check wallpaper
        run: npm run check -w @spotify-wallpaper/wallpaper

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build Worker artifact
        run: npm run build -w @spotify-wallpaper/cloudflare-worker
        env:
          TOKEN_ENCRYPTION_KEYRING: SWPB_CI_WORKER_KEY_CANARY
          PAIRING_HMAC_KEYRING: SWPB_CI_WORKER_KEY_CANARY
          OAUTH_STATE_HMAC_KEY: SWPB_CI_WORKER_KEY_CANARY

      - name: Dry-run generated preview Worker config
        shell: pwsh
        env:
          CLOUDFLARE_DEPLOY_ENV: preview
          CLOUDFLARE_PREVIEW_PUBLIC_BASE_URL: https://preview-ci-worker.example
          CLOUDFLARE_PREVIEW_PRIMARY_D1_ID: 11111111-1111-4111-8111-111111111111
          CLOUDFLARE_PREVIEW_DELETION_D1_ID: 22222222-2222-4222-8222-222222222222
          CLOUDFLARE_PRODUCTION_PUBLIC_BASE_URL: https://ci-worker.example
          CLOUDFLARE_PRODUCTION_PRIMARY_D1_ID: 33333333-3333-4333-8333-333333333333
          CLOUDFLARE_PRODUCTION_DELETION_D1_ID: 44444444-4444-4444-8444-444444444444
        run: |
          npm run prepare:deploy:preview -w @spotify-wallpaper/cloudflare-worker
          npx wrangler deploy --dry-run --env preview --config apps/cloudflare-worker/.wrangler.preview.generated.json --outdir dist-preview

      - name: Dry-run generated production Worker config
        shell: pwsh
        env:
          CLOUDFLARE_DEPLOY_ENV: production
          CLOUDFLARE_PRODUCTION_PUBLIC_BASE_URL: https://ci-worker.example
          CLOUDFLARE_PRODUCTION_PRIMARY_D1_ID: 33333333-3333-4333-8333-333333333333
          CLOUDFLARE_PRODUCTION_DELETION_D1_ID: 44444444-4444-4444-8444-444444444444
          CLOUDFLARE_PREVIEW_PUBLIC_BASE_URL: https://preview-ci-worker.example
          CLOUDFLARE_PREVIEW_PRIMARY_D1_ID: 11111111-1111-4111-8111-111111111111
          CLOUDFLARE_PREVIEW_DELETION_D1_ID: 22222222-2222-4222-8222-222222222222
        run: |
          npm run prepare:deploy:production -w @spotify-wallpaper/cloudflare-worker
          npx wrangler deploy --dry-run --env production --config apps/cloudflare-worker/.wrangler.production.generated.json --outdir dist-production

      - name: Build Workshop artifact
        run: npm run build:workshop -w @spotify-wallpaper/wallpaper
        env:
          VITE_SPOTIFY_BACKEND_ORIGIN: https://ci-worker.example
          VITE_SPOTIFY_ACCESS_TOKEN: SWPB_CI_ACCESS_TOKEN_CANARY
          VITE_SPOTIFY_REFRESH_TOKEN: SWPB_CI_REFRESH_TOKEN_CANARY
          VITE_SPOTIFY_PKCE_VERIFIER: SWPB_CI_PKCE_VERIFIER_CANARY
          VITE_SPOTIFY_WORKER_KEY: SWPB_CI_WORKER_KEY_CANARY

      - name: Scan release artifacts for secrets
        run: npm run scan:public-backend-secrets:all

      - name: Check whitespace
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          } elseif ("${{ github.event.before }}" -match "^0+$") {
            git diff-tree --check --no-commit-id -r "${{ github.sha }}"
          } else {
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          }
