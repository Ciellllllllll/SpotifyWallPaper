name: Public Backend CI

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-worker-ci.yml
      - apps/public-backend/**
      - deploy/public-backend/**
      - apps/spotify-auth/**
      - apps/configurator/**
      - apps/wallpaper/**
      - crates/**
      - docs/operations/**
      - packages/shared-types/**
      - packages/wallpaper-view/**
      - scripts/build-public-backend-artifact.mjs
      - scripts/build-public-backend-artifact.test.mjs
      - scripts/check-public-backend-secrets.mjs
      - scripts/check-public-backend-secrets.test.mjs
      - Cargo.lock
      - Cargo.toml
      - package-lock.json
      - package.json
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-worker-ci.yml
      - apps/public-backend/**
      - deploy/public-backend/**
      - apps/spotify-auth/**
      - apps/configurator/**
      - apps/wallpaper/**
      - crates/**
      - docs/operations/**
      - packages/shared-types/**
      - packages/wallpaper-view/**
      - scripts/build-public-backend-artifact.mjs
      - scripts/build-public-backend-artifact.test.mjs
      - scripts/check-public-backend-secrets.mjs
      - scripts/check-public-backend-secrets.test.mjs
      - Cargo.lock
      - Cargo.toml
      - package-lock.json
      - package.json

permissions:
  contents: read

concurrency:
  group: public-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared types for clean-clone consumers
        run: npm run build:shared-types

      - name: Test public backend
        run: npm run test -w @spotify-wallpaper/public-backend

      - name: Check public backend
        run: npm run check -w @spotify-wallpaper/public-backend

      - name: Test public backend secret scanner
        run: npm run test:public-backend-secrets

      - name: Build and verify isolated public backend artifact
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "spotify-wallpaper-public-backend-artifact"
          node scripts/build-public-backend-artifact.mjs $artifact $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-public-backend-secrets.mjs $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SWP_ARTIFACT_OUTPUT = $artifact
          npm run test:public-backend-artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test wallpaper
        run: npm run test -w @spotify-wallpaper/wallpaper

      - name: Check wallpaper
        run: npm run check -w @spotify-wallpaper/wallpaper

      - name: Build legacy release artifacts for secret scan
        shell: pwsh
        run: |
          npm run build -w @spotify-wallpaper/spotify-auth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -w @spotify-wallpaper/configurator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build Workshop artifact
        shell: pwsh
        env:
          VITE_SPOTIFY_BACKEND_ORIGIN: https://ciel-spotify-wallpaper.duckdns.org
        run: |
          npm run build:workshop -w @spotify-wallpaper/wallpaper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan release artifacts for secrets
        run: npm run scan:public-backend-secrets:all

      - name: Check whitespace
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          } elseif ("${{ github.event.before }}" -match "^0+$") {
            git diff-tree --check --no-commit-id -r "${{ github.sha }}"
          } else {
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          }

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Linux integration image
        run: docker build -f deploy/public-backend/test/Dockerfile.synthetic-e2e -t spotify-wallpaper-public-backend-integration .

      - name: Run synthetic OAuth integration
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" spotify-wallpaper-public-backend-integration sh /repo/deploy/public-backend/test/synthetic-e2e.sh

      - name: Run restore and reconcile integration
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" spotify-wallpaper-public-backend-integration sh /repo/deploy/public-backend/test/restore-reconcile-integration.sh

      - name: Run release integration
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" spotify-wallpaper-public-backend-integration sh /repo/deploy/public-backend/test/release-integration.sh
