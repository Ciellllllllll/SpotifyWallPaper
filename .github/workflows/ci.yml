name: CI

on:
  push:
    tags: ['release-*']

permissions:
  contents: read

jobs:
  release-branch:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require a commit contained in develop or master
        id: branch
        shell: pwsh
        run: |
          $branches = @(git branch --remotes --contains HEAD --format='%(refname)')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release ancestry.' }
          $develop = $branches -ccontains 'refs/remotes/origin/develop'
          $master = $branches -ccontains 'refs/remotes/origin/master'
          if (-not ($develop -or $master)) { throw 'Release commit must be contained in develop or master.' }
          "master=$($master.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  web:
    needs: release-branch
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Authority unit tests run once below through npm test.
      - name: Check repository authority
        run: npm run check:repository-authority

      - name: Check repository preservation
        run: npm run check:repository-preservation

      - name: Setup Rust and WASM tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build shared types for clean-clone consumers
        run: npm run build:shared-types

      - name: TypeScript tests
        run: npm test

      - name: TypeScript checks
        run: npm run check

      - name: Web builds and generated WASM
        run: npm run build

      - name: Optional application checks
        run: npm run check:optional

      - name: Optional application tests
        run: npm run test:optional

      - name: Optional application builds
        run: npm run build:optional

      - name: Actual WASM parity
        run: npm run test:wasm-parity

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser characterization
        run: npx playwright test tests/playwright/wallpaper-characterization.spec.ts tests/playwright/direct-credentials.spec.ts

  rust:
    needs: release-branch
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust formatting
        run: cargo fmt --manifest-path crates/visual-core/Cargo.toml -- --check

      - name: Visual core check
        run: cargo check --manifest-path crates/visual-core/Cargo.toml --all-features

      - name: Visual core tests
        run: cargo test --manifest-path crates/visual-core/Cargo.toml --all-features

      - name: Rust WASM target check
        run: cargo check --manifest-path crates/visual-core/Cargo.toml --target wasm32-unknown-unknown --all-features

  tauri:
    needs: release-branch
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Tauri formatting
        run: cargo fmt --manifest-path apps/configurator/src-tauri/Cargo.toml -- --check

      - name: Tauri backend check
        run: cargo check --manifest-path apps/configurator/src-tauri/Cargo.toml --all-features

      - name: Tauri backend tests
        run: cargo test --manifest-path apps/configurator/src-tauri/Cargo.toml --all-features

  loopback:
    needs: release-branch
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Loopback backend formatting
        run: cargo fmt --manifest-path apps/backend/Cargo.toml -- --check

      - name: Loopback backend check
        run: cargo check --manifest-path apps/backend/Cargo.toml --all-features

      - name: Loopback backend tests
        run: cargo test --manifest-path apps/backend/Cargo.toml --all-features
